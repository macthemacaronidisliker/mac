<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">M</span>
      <div>
        <div class="brand-name">MARK HOME</div>
        <div class="brand-tagline">Find a place that feels like home.</div>
      </div>
    </div>

    <button class="profile-btn">◯</button>
  </header>

  <main>

    <!-- HOME -->
    <section id="homePage" class="page active">

      <div class="hero">
        <div>
          <p class="eyebrow">WELCOME TO MARK HOME</p>
          <h1>Homes worth<br><span>looking at.</span></h1>
          <p class="hero-text">
            Discover homes presented like beautiful showrooms.
          </p>
        </div>
      </div>

      <div class="search-box">
        <span>⌕</span>
        <input id="searchInput" type="text"
               placeholder="Search London, area or postcode">
      </div>

      <div class="filter-row">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="rent">Rent</button>
        <button class="filter" data-filter="buy">Buy</button>
      </div>

      <div class="section-heading">
        <div>
          <p class="eyebrow">DISCOVER</p>
          <h2>Featured homes</h2>
        </div>
        <span id="propertyCount"></span>
      </div>

      <div id="propertyGrid" class="property-grid"></div>

    </section>


    <!-- DETAILS -->
    <section id="detailsPage" class="page">

      <button id="backButton" class="back-button">← Back</button>

      <div id="detailsContent"></div>

    </section>


    <!-- SAVED -->
    <section id="savedPage" class="page">

      <div class="page-title">
        <p class="eyebrow">YOUR COLLECTION</p>
        <h1>Saved homes</h1>
      </div>

      <div id="savedGrid" class="property-grid"></div>

    </section>


    <!-- PROFILE -->
    <section id="profilePage" class="page">

      <div class="profile-card">
        <div class="profile-icon">M</div>
        <h1>MARK HOME</h1>
        <p>Your property collection</p>

        <div class="profile-option">
          <span>♡</span>
          Saved homes
          <strong id="savedNumber">0</strong>
        </div>

        <div class="profile-option">
          <span>⌕</span>
          Property alerts
          <strong>›</strong>
        </div>

        <div class="profile-option">
          <span>⚙</span>
          Settings
          <strong>›</strong>
        </div>
      </div>

    </section>

  </main>


  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <button class="nav-item active" data-page="homePage">
      <span>⌂</span>
      <small>Home</small>
    </button>

    <button class="nav-item" data-page="homePage">
      <span>⌕</span>
      <small>Search</small>
    </button>

    <button class="nav-item" data-page="savedPage">
      <span>♡</span>
      <small>Saved</small>
    </button>

    <button class="nav-item" data-page="profilePage">
      <span>◯</span>
      <small>Profile</small>
    </button>

  </nav>

</div>
